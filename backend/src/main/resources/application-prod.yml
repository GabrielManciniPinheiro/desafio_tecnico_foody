spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # O plano gratuito do Neon tem limite de conexões simultâneas
      maximum-pool-size: 5

app:
  jwt:
    secret: ${JWT_SECRET}

server:
  # Atrás do proxy do Render: respeita X-Forwarded-Proto/Host ao montar URLs (ex.: header Location)
  forward-headers-strategy: native
