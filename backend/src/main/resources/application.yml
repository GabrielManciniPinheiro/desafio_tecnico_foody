spring:
  application:
    name: foody-api
  config:
    # Credenciais do banco podem vir de um arquivo backend/.env (fora do Git)
    import: optional:file:.env[.properties]
  profiles:
    default: local
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

app:
  jwt:
    issuer: foody-api
    expiration: 8h

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
